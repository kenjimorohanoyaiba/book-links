<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ケンシロウ | 著書一覧</title>
<style>
  :root {
    --bg: #16130f;
    --bg-card: #201c16;
    --accent: #e8b98a;
    --accent-soft: #f3d9b8;
    --text: #f3ede2;
    --text-dim: #b9b0a0;
    --border: #332c22;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", "Segoe UI", -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px 64px;
  }
  .page {
    width: 100%;
    max-width: 480px;
  }
  .profile {
    text-align: center;
    margin-bottom: 32px;
  }
  .avatar {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: linear-gradient(135deg, #f3d9b8, #d99a63);
    margin: 0 auto 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    color: #16130f;
    font-weight: 700;
    overflow: hidden;
  }
  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .profile h1 {
    font-size: 20px;
    margin: 0 0 4px;
    letter-spacing: 0.02em;
  }
  .profile p {
    margin: 0;
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.6;
  }
  .handle {
    display: inline-block;
    margin-top: 10px;
    font-size: 12px;
    color: var(--accent);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 12px;
    text-decoration: none;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .handle:hover {
    border-color: var(--accent);
    color: var(--accent-soft);
  }

  .category {
    margin-top: 34px;
  }
  .category-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent-soft);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .category-title::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  .book-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 18px;
    margin-bottom: 18px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .book-card:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  .cover {
    width: 68%;
    max-width: 230px;
    aspect-ratio: 5 / 8;
    border-radius: 10px;
    background: linear-gradient(160deg, #3a3126, #221d16);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: var(--text-dim);
    text-align: center;
    line-height: 1.4;
    padding: 6px;
    overflow: hidden;
    box-shadow: 0 12px 28px rgba(0,0,0,0.45);
  }
  .cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .book-info {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .book-title {
    font-size: 16.5px;
    font-weight: 700;
    margin: 0 0 8px;
    line-height: 1.4;
  }
  .book-desc {
    font-size: 13px;
    color: var(--text-dim);
    margin: 0 0 12px;
    line-height: 1.6;
  }
  .book-cta {
    font-size: 12.5px;
    color: var(--accent);
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .book-cta::after {
    content: "\2192";
  }

  footer {
    text-align: center;
    margin-top: 36px;
    font-size: 11px;
    color: var(--text-dim);
  }
</style>
</head>
